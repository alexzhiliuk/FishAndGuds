repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        exclude: ^alembic/
        additional_dependencies:
          - fastapi
          - sqlalchemy[asyncio]
          - pydantic
          - pydantic-settings
          - types-requests
