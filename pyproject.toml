[project]
name = "fish-loyalty-bot"
version = "0.1.0"
description = "Telegram loyalty bot for Рыба и гады"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.15,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "apscheduler>=3.10.4,<4",
    "pydantic-settings>=2.7,<3",
    "qrcode[pil]>=8.0,<9",
    "greenlet>=3.1,<4",
    "redis>=5,<8",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
