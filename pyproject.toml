[project]
name = "fish-loyalty-bot"
version = "0.1.0"
description = "Telegram loyalty bot for Рыба и гады"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.15,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "apscheduler>=3.10.4,<4",
    "pydantic-settings>=2.7,<3",
    "qrcode[pil]>=8.0,<9",
    "greenlet>=3.1,<4",
    "redis>=5,<8",
]

[dependency-groups]
dev = [
    "mypy==1.16.0",
    "pre-commit>=4.3,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff==0.15.15",
    "types-qrcode>=8,<9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["alembic", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disable_error_code = ["arg-type", "call-arg"]
